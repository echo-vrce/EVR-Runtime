[workspace]
resolver = "2"
members = ["crates/evr-manifest", "crates/evr-updater", "crates/evr-sign", "crates/evr-loader"]

[workspace.package]
version = "0.10.1"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
base64 = "0.22"
thiserror = "1"
